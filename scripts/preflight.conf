# Preflight configuration for ADSb-Vue.
#
# Committed with GENERIC defaults so an outside contributor can run preflight out
# of the box against their own feeder. No real host addresses live here.
#
# Put your real hosts in  ~/.config/adsb-volume/preflight.local.conf  (outside the
# repo, so every git worktree finds it; a gitignored file would be absent from a
# fresh worktree checkout). preflight.sh sources that file AFTER this one, so its
# assignments win. deploy.sh and logs.sh do the same for the host variables.
#
# This file defines defaults and a run_checks function; preflight.sh sources the
# local override in between, then calls run_checks, so the checks see your values.

# --- defaults (override in preflight.local.conf) -----------------------------
: "${TARGET:=user@feeder.example}"          # production host for ssh / deploy
: "${CONTAINER:=adsbvue}"                    # docker container name there
: "${REMOTE_DIR:=/opt/adsbvue}"              # compose project dir on the host
: "${WEB_URL:=http://localhost:24556}"       # the deployed viewer
: "${FEED_URL:=http://localhost:8080}"       # tar1090 / Ultrafeeder base URL
: "${SITE_NOTE:=}"                           # freeform site facts (coords, mast height)

# --- checks ------------------------------------------------------------------
# A function, not inline, so preflight.sh can apply the local override first.
run_checks() {
  section "Toolchain"
  check_cmd "python3" python3 --version
  check_cmd "docker"  docker --version
  check_cmd "ssh"     ssh -V
  check_cmd "curl"    curl --version

  section "Repository"
  check_git
  check_file "server.py"          "server.py"
  check_file "index.html"         "index.html"
  check_file "docker-compose.yml" "docker-compose.yml"
  note "checkout: $(git rev-parse --show-toplevel)"

  section "Hosts"
  check_ssh "feeder host" "$TARGET"

  section "Upstream ADS-B feed"
  check_http "aircraft.json" "$FEED_URL/data/aircraft.json" 200

  section "Deployed service"
  check_http "viewer /health" "$WEB_URL/health" 200

  section "Site"
  note "${SITE_NOTE:-(set receiver/site facts in preflight.local.conf)}"

  note "SSH is key-based and non-interactive; the check above confirms it. Do not ask for access."
  note "Deployed container runs the ingest-poll image (polls aircraft.json). main's code still reads chunks; they merge soon."
  note "Push BOTH remotes: 'git push' -> Gitea (origin), plus 'git push github <branch>'. Only the GitHub push builds the image."
  note "Local server here needs dangerouslyDisableSandbox, or the sandbox SIGSTKFLT-kills it."
}
