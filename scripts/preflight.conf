# Preflight configuration for ADSb-Vue.
#
# Sourced two ways:
#   - by preflight.sh, where the check_* helpers (lib/checks.sh) are defined and
#     the checks below run;
#   - by deploy.sh and logs.sh, which only want the host variables at the top.
# The checks are guarded so sourcing this from deploy.sh/logs.sh just sets vars.
#
# Committed on purpose (not gitignored): a worktree that gets preflight.sh without
# this file has a script and no definition of "healthy". Note this publishes the
# host names below if the branch reaches public GitHub; they are private
# (RFC1918 / .lan) and not internet-reachable.

# --- host + deploy variables (deploy.sh and logs.sh read these) --------------
TARGET="john@feeder.example"        # production host, key-based ssh
CONTAINER="adsbvue"                              # docker container name there
REMOTE_DIR="/opt/adsbvue"                        # compose project dir on the host
WEB_URL="http://feeder.example:24556"   # the deployed viewer
FEED_URL="http://feeder.example"        # tar1090 / Ultrafeeder (LAN :80)

# --- checks (only run under preflight.sh) ------------------------------------
if declare -f check_cmd >/dev/null 2>&1; then

  section "Toolchain"
  check_cmd "python3" python3 --version
  check_cmd "docker"  docker --version
  check_cmd "ssh"     ssh -V
  check_cmd "curl"    curl --version

  section "Repository"
  check_git
  check_file "server.py"          "server.py"
  check_file "index.html"         "index.html"
  check_file "docker-compose.yml" "docker-compose.yml"
  note "checkout: $(git rev-parse --show-toplevel)"

  section "Hosts"
  check_ssh "skyscanner" "$TARGET"

  section "Upstream ADS-B feed"
  check_http "aircraft.json" "$FEED_URL/data/aircraft.json" 200

  section "Deployed service (skyscanner)"
  check_http "viewer /health" "$WEB_URL/health" 200

  section "Site"
  note "receiver REDACTED, REDACTED  (KMSP area, Hudson WI)"
  note "antenna: 306 ft MSL ground + 60 ft mast  (used by the terrain/range model)"

  # Reminders that are only true when the checks above pass.
  note "SSH is key-based and non-interactive (docker group, no sudo). Do not ask for access."
  note "Deployed container runs the ingest-poll image (polls aircraft.json). main's code still reads chunks; they merge soon."
  note "Push BOTH remotes: 'git push' -> Gitea (origin), plus 'git push github <branch>'. Only the GitHub push builds the image."
  note "Local server here needs dangerouslyDisableSandbox, or the sandbox SIGSTKFLT-kills it."
fi
